<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {

  /* Sticky navbar shadow on scroll */
  var nav = document.querySelector('.dre-navbar');
  if (nav) {
    var toggleNav = function () { nav.classList.toggle('is-scrolled', window.scrollY > 12); };
    toggleNav();
    window.addEventListener('scroll', toggleNav, { passive: true });
  }

  /* Reveal-on-scroll */
  var revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && revealEls.length) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    revealEls.forEach(function (el) { io.observe(el); });
  } else {
    revealEls.forEach(function (el) { el.classList.add('is-visible'); });
  }

  /* Animated counters */
  var counters = document.querySelectorAll('[data-counter]');
  if ('IntersectionObserver' in window && counters.length) {
    var countIo = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var el = entry.target;
        var target = parseFloat(el.getAttribute('data-counter'));
        var suffix = el.getAttribute('data-suffix') || '';
        var duration = 1400, start = null;
        function step(ts) {
          if (!start) start = ts;
          var progress = Math.min((ts - start) / duration, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          var value = target % 1 === 0 ? Math.floor(eased * target) : (eased * target).toFixed(1);
          el.textContent = value + suffix;
          if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
        countIo.unobserve(el);
      });
    }, { threshold: 0.4 });
    counters.forEach(function (el) { countIo.observe(el); });
  }

  /* Portfolio filter */
  var filterBtns = document.querySelectorAll('[data-filter]');
  var folioItems = document.querySelectorAll('[data-category]');
  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      filterBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var value = btn.getAttribute('data-filter');
      folioItems.forEach(function (item) {
        var show = value === 'all' || item.getAttribute('data-category') === value;
        item.closest('.folio-col').style.display = show ? '' : 'none';
      });
    });
  });

  /* Testimonial slider (simple auto-rotating) */
  var track = document.querySelector('[data-testi-track]');
  if (track) {
    var slides = track.children;
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % slides.length;
      track.style.transform = 'translateX(-' + (idx * 100) + '%)';
    }, 5000);
  }

  /* Bootstrap form validation styling */
  var forms = document.querySelectorAll('.needs-validation');
  Array.prototype.slice.call(forms).forEach(function (form) {
    form.addEventListener('submit', function (event) {
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
      }
      form.classList.add('was-validated');
    }, false);
  });

  /* Mobile admin sidebar toggle */
  var sidebarToggle = document.querySelector('[data-sidebar-toggle]');
  var adminSidebar = document.querySelector('.admin-sidebar');
  if (sidebarToggle && adminSidebar) {
    sidebarToggle.addEventListener('click', function () {
      adminSidebar.classList.toggle('is-open');
    });
  }
});
</script>
