{% extends "admin/base.html" %}
{% set admin_page_title = "Settings" %}
{% block title %}Settings | Admin | Digital Rank Experts{% endblock %}

{% block content %}
<div class="row g-4">
  <div class="col-lg-7">
    <div class="kpi-card mb-4">
      <h6 class="mb-3">Business Information</h6>
      <form method="post" action="{{ url_for('admin_settings') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
          <div class="col-md-6"><label for="setCompany">Company Name</label><input type="text" class="form-control" id="setCompany" name="company_name" value="Digital Rank Experts"></div>
          <div class="col-md-6"><label for="setOwner">Owner Name</label><input type="text" class="form-control" id="setOwner" name="owner_name" value="Sohail Ahmad"></div>
          <div class="col-md-6"><label for="setPhone">Phone Number</label><input type="tel" class="form-control" id="setPhone" name="phone" value="+92 3297 562092"></div>
          <div class="col-md-6"><label for="setEmail">Business Email</label><input type="email" class="form-control" id="setEmail" name="email" value="digitalrankexperts@gmail.com"></div>
          <div class="col-12"><label for="setAddress">Address</label><input type="text" class="form-control" id="setAddress" name="address" value="Johar Town, Lahore, Pakistan"></div>
          <div class="col-12"><label for="setGbp">Google Business Profile URL</label><input type="url" class="form-control" id="setGbp" name="gbp_url" value="https://maps.app.goo.gl/uuH6fPQYDqHBzFHE6"></div>
          <div class="col-12"><button type="submit" class="btn btn-signal">Save Changes</button></div>
        </div>
      </form>
    </div>

    <div class="kpi-card">
      <h6 class="mb-3">Change Password</h6>
      <form method="post" action="{{ url_for('admin_settings') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
          <div class="col-md-6"><label for="curPass">Current Password</label><input type="password" class="form-control" id="curPass" name="current_password"></div>
          <div class="col-md-6"></div>
          <div class="col-md-6"><label for="newPass">New Password</label><input type="password" class="form-control" id="newPass" name="new_password" minlength="8"></div>
          <div class="col-md-6"><label for="confirmPass">Confirm New Password</label><input type="password" class="form-control" id="confirmPass" name="confirm_password" minlength="8"></div>
          <div class="col-12"><button type="submit" class="btn btn-outline-signal">Update Password</button></div>
        </div>
      </form>
    </div>
  </div>

  <div class="col-lg-5">
    <div class="kpi-card">
      <h6 class="mb-3">Notification Preferences</h6>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="notifyLeads" checked>
        <label class="form-check-label fw-normal" for="notifyLeads">Email me on new contact leads</label>
      </div>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" role="switch" id="notifyRank" checked>
        <label class="form-check-label fw-normal" for="notifyRank">Weekly rank-change summary</label>
      </div>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" role="switch" id="notifyBlog">
        <label class="form-check-label fw-normal" for="notifyBlog">Notify when a scheduled post publishes</label>
      </div>
    </div>
  </div>
</div>
{% endblock %}
